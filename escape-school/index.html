<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>달무리초 탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&family=Nanum+Pen+Script&display=swap">
<style>
/* 한밤의 학교: 짙은 남색 바탕 위 한 장씩 넘어가는 이야기 카드, 규칙서는 누런 종이로 덮어 펼친다 */
:root{
  --night:#121829; --night2:#1B2338; --night3:#252F4A; --line:#34405F;
  --ink:#ECE6D6; --dim:#A3ABBF; --moon:#F1D27A; --halo:#93A6DA;
  --paper:#F2E8D0; --paper2:#E6D8B8; --paperInk:#3A2E22; --rule:#C9B48A;
  --red:#C2493B; --pencil:#3F5596;
  --ok:#83C9A4; --bad:#E79373; --weird:#BC92E0;
  --f-story:"Gowun Batang","Noto Serif KR","AppleMyungjo",serif;
  --f-ui:"Jua","Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Nanum Pen Script","Gaegu",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--night);color:var(--ink);font-family:var(--f-story);font-size:19px;line-height:1.75;
  background-image:radial-gradient(circle at 85% -10%, rgba(147,166,218,.18), transparent 45%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--moon);outline-offset:3px}

/* 상단 상태 줄 */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-family:var(--f-ui);font-size:1rem;color:var(--dim);
  padding:10px 14px;background:var(--night2);border:1px solid var(--line);border-radius:14px}
.hud .where{color:var(--ink);flex:1 1 180px;min-width:0}
.hud .stat{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.keyico{width:16px;height:16px;border-radius:50%;border:3px solid var(--moon);position:relative}
.dots{display:inline-flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--weird)}
.dots i.on{background:var(--weird)}
.bookbtn{font-family:var(--f-ui);font-size:1rem;background:var(--paper);color:var(--paperInk);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.bookbtn.new{animation:ping 1.2s ease-out 3}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(241,210,122,.8)}100%{box-shadow:0 0 0 14px rgba(241,210,122,0)}}

/* 이야기 카드 */
.card{background:var(--night2);border:1px solid var(--line);border-radius:20px;padding:22px clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:16px}
.place{font-family:var(--f-ui);font-size:.95rem;letter-spacing:.06em;color:var(--halo)}
.story p{margin:0 0 .6em}
.story p:last-child{margin-bottom:0}
.story .say{color:var(--moon)}
.fade{animation:fade .5s ease-out both}
.fade:nth-child(2){animation-delay:.15s}.fade:nth-child(3){animation-delay:.3s}.fade:nth-child(4){animation-delay:.45s}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.q{font-family:var(--f-ui);font-size:1.3rem;line-height:1.45;color:var(--ink);background:var(--night3);border-radius:14px;padding:14px 16px;text-wrap:balance}
.vis{display:flex;justify-content:center;background:var(--paper);border-radius:14px;padding:12px;overflow-x:auto}
.vis svg{max-width:100%;height:auto;display:block}
.calc{font-family:var(--f-ui);font-size:1.45rem;color:var(--paperInk);border-collapse:collapse;font-variant-numeric:tabular-nums}
.calc td{padding:2px 8px;text-align:right}
.calc td.eq{text-align:center}
.calc tr.ask td{color:var(--red)}

.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;min-height:64px;
  background:var(--night3);border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-family:var(--f-ui);font-size:1.2rem;line-height:1.35;
  transition:transform .1s,border-color .15s,background .15s}
.opt:hover{border-color:var(--halo)}
.opt:active{transform:scale(.98)}
.opt .tag{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--night);color:var(--moon);font-size:1rem}
.opt .ov{flex:none;background:var(--paper);border-radius:10px;padding:4px;display:grid;place-items:center}
.opt .ov svg{display:block;width:96px;height:auto}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt.choice .ot{display:flex;flex-direction:column;gap:4px}
.opt.choice small{font-family:var(--f-story);font-size:.95rem;color:var(--dim);line-height:1.5}
.opt.choice small.lv{font-family:var(--f-ui);color:var(--moon)}
.tier{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-family:var(--f-ui);color:var(--dim);font-size:1rem}
.pips{display:inline-flex;gap:5px}.pips i{width:22px;height:8px;border-radius:4px;background:var(--line)}.pips i.on{background:var(--moon)}
.note{background:var(--paper);color:var(--paperInk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;transform:rotate(-.6deg)}
.note b{font-family:var(--f-ui);font-weight:400;color:#8A7558}.note .hand{font-family:var(--f-hand);font-size:1.6rem;line-height:1.25;color:var(--pencil)}
.levelup{font-family:var(--f-ui);color:var(--moon);font-size:1.1rem}

/* 결과 상자 */
.res{border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;border:2px solid}
.res h3{margin:0;font-family:var(--f-ui);font-weight:400;font-size:1.35rem}
.res p{margin:0}
.res.ok{border-color:var(--ok);background:rgba(131,201,164,.08)} .res.ok h3{color:var(--ok)}
.res.bad{border-color:var(--bad);background:rgba(231,147,115,.08)} .res.bad h3{color:var(--bad)}
.res.weird{border-color:var(--weird);background:rgba(188,146,224,.09)} .res.weird h3{color:var(--weird)}
.hint{background:var(--paper);color:var(--paperInk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.hint b{font-family:var(--f-ui);font-weight:400;color:var(--red)}
.hint .hand{font-family:var(--f-hand);font-size:1.6rem;line-height:1.25;color:var(--pencil)}
.ally{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);color:var(--ok);font-size:1rem}
.next{align-self:flex-end;font-family:var(--f-ui);font-size:1.2rem;background:var(--moon);color:#2A2210;border:0;border-radius:999px;padding:12px 26px;cursor:pointer;min-height:52px}
.next.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}

/* 첫 화면 */
.title{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding-top:10px}
@media (max-width:620px){.title{grid-template-columns:1fr}}
.moon{width:120px;height:120px;border-radius:50%;background:var(--moon);position:relative;margin:30px 0 18px 30px;
  box-shadow:0 0 0 18px rgba(147,166,218,.10),0 0 0 19px rgba(147,166,218,.55),0 0 0 44px rgba(147,166,218,.06),0 0 60px 30px rgba(241,210,122,.18)}
.moon::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.08);top:30px;left:58px;box-shadow:-30px 34px 0 -6px rgba(0,0,0,.07)}
h1{font-family:var(--f-ui);font-weight:400;font-size:clamp(2.6rem,9vw,4.2rem);line-height:1.05;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{font-family:var(--f-ui);color:var(--halo);font-size:1.15rem;margin:8px 0 0}
.qrcard{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);color:var(--paperInk);border:0;border-radius:18px;padding:12px;cursor:pointer;font-family:var(--f-ui);width:190px;max-width:100%;justify-self:center}
.qrcard svg{width:100%;height:auto;display:block}
.qrcard span{font-size:1rem}
.how{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.how li{display:flex;gap:12px;align-items:flex-start}
.how .chip{flex:none;font-family:var(--f-ui);font-size:.95rem;border-radius:999px;padding:2px 12px;margin-top:3px}
.chip.c{background:rgba(131,201,164,.18);color:var(--ok)} .chip.w{background:rgba(231,147,115,.18);color:var(--bad)} .chip.x{background:rgba(188,146,224,.2);color:var(--weird)}
.big{font-size:1.35rem;padding:14px 34px}

/* 규칙서 / 도감 / QR 덮개 */
.lay{position:fixed;inset:0;z-index:40;background:rgba(6,9,18,.82);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.book{background:var(--paper);color:var(--paperInk);width:min(760px,100%);border-radius:6px 18px 18px 6px;padding:22px clamp(16px,4vw,36px) 26px;position:relative;
  background-image:repeating-linear-gradient(to bottom, transparent 0 33px, rgba(150,120,70,.22) 33px 34px);box-shadow:inset 10px 0 0 var(--paper2)}
.book h2{font-family:var(--f-ui);font-weight:400;font-size:1.7rem;margin:0;text-wrap:balance}
.book .stamp{display:inline-block;font-family:var(--f-ui);color:var(--red);border:2px solid var(--red);border-radius:6px;padding:0 8px;transform:rotate(-4deg);font-size:.95rem;margin-top:6px}
.book h3{font-family:var(--f-ui);font-weight:400;font-size:1.3rem;margin:22px 0 6px;color:var(--paperInk);display:flex;gap:10px;align-items:baseline}
.book h3 small{font-size:.9rem;color:#8A7558}
.book ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;line-height:1.7}
.book li.x s{color:#7a6a55;text-decoration-color:var(--red);text-decoration-thickness:2px}
.book .fix{display:block;font-family:var(--f-hand);font-size:1.65rem;line-height:1.2;color:var(--pencil)}
.book .warn{list-style:none;margin-left:-1.4em;color:var(--red)}
.book .torn{color:#8A7558;font-style:italic;padding:8px 0}
.book .sign{font-family:var(--f-hand);font-size:1.7rem;color:var(--pencil);margin-top:18px;line-height:1.3}
.book .hl{background:rgba(241,210,122,.55);border-radius:3px}
.close{position:sticky;top:0;float:right;font-family:var(--f-ui);background:var(--paperInk);color:var(--paper);border:0;border-radius:999px;padding:8px 18px;cursor:pointer;font-size:1rem;z-index:2}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}
.dx{border:2px solid var(--rule);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.35)}
.dx b{font-family:var(--f-ui);font-weight:400;font-size:1.1rem}
.dx small{color:#7A6A55;font-size:.88rem;line-height:1.45}
.dx.lock{border-style:dashed;background:transparent}
.dx.lock b{color:#9A8A70}
.badge{align-self:flex-start;font-family:var(--f-ui);font-size:.8rem;border-radius:999px;padding:0 9px;color:#fff}
.b-esc{background:#4E8F6C}.b-fail{background:#A0603F}.b-weird{background:#7F5AA8}.b-secret{background:#2F3F6E}.b-happy{background:#C77B2E}.b-true{background:#B8902A;box-shadow:0 0 0 2px #F1D27A}
.qrbig{background:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(560px,100%);margin:auto;color:#222}
.qrbig svg{width:min(70vmin,460px);height:auto;max-width:100%}
.qrbig p{margin:0;font-family:var(--f-ui);font-size:1.1rem;word-break:break-all;text-align:center}

/* 결말 */
.endhead{display:flex;flex-direction:column;gap:6px}
.endno{font-family:var(--f-ui);color:var(--dim);font-size:1rem}
.endname{font-family:var(--f-ui);font-size:clamp(2rem,7vw,3rem);line-height:1.1;margin:0;font-weight:400;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{background:var(--night3);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.st b{font-family:var(--f-ui);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.st span{font-size:.9rem;color:var(--dim)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--paper);color:var(--paperInk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:1rem}
.rv .rq{font-family:var(--f-ui);font-size:1.05rem}
.rv .ra{color:#2F6B4C}
.rv .rx{color:var(--red)}
.newend{font-family:var(--f-ui);color:var(--moon)}
.why{background:rgba(231,147,115,.12);border-left:4px solid var(--bad);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.why b{font-family:var(--f-ui);font-weight:400;color:var(--bad)}
.figcap{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-ui);color:var(--paperInk);font-size:1rem}
.doors{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px 14px}
.doors .figcap svg{width:96px;height:auto}
.doors .arrow{font-family:var(--f-ui);font-size:2rem;color:var(--paperInk);align-self:center}
.numtab{border-collapse:collapse;font-family:var(--f-ui);font-size:1.3rem;color:var(--paperInk);font-variant-numeric:tabular-nums}
.numtab td{border:2px solid var(--rule);padding:6px 12px;text-align:center;min-width:3.4em}
.numtab td.ask{color:var(--red);background:rgba(194,73,59,.08)}
.ov.inline{display:inline-grid;vertical-align:middle;background:var(--paper);border-radius:10px;padding:4px}
.ov.inline svg{width:72px;height:auto}
.card.seal{border:3px double var(--red);box-shadow:0 0 0 4px rgba(194,73,59,.12)}
.sealmark{display:inline-block;font-family:var(--f-ui);color:#fff;background:var(--red);border-radius:6px;padding:0 8px;margin-right:6px;transform:rotate(-3deg)}
.sub3{font-family:var(--f-ui);font-weight:400;margin:6px 0 0;font-size:1.25rem}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.unit{display:flex;align-items:center;gap:10px;background:var(--night3);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.unit .un{font-family:var(--f-ui);flex:1 1 auto;min-width:0}
.unit .mk{font-size:1.2rem;letter-spacing:.1em;color:var(--moon)}
.unit .uw{font-family:var(--f-ui);font-size:.95rem;color:var(--ok)}
.unit .uw.warn{color:var(--bad)}
.legend{margin:0;color:var(--dim);font-size:.9rem}
.riddle{color:var(--pencil)!important;font-family:var(--f-hand);font-size:1.25rem!important;line-height:1.25!important}
.b-lock{background:#9A8A70}
.next.small{font-size:1rem;padding:10px 18px;min-height:44px}
.logsum{font-family:var(--f-ui);font-size:1.05rem;line-height:1.6;margin:14px 0}
.tblwrap{overflow-x:auto;max-width:100%}
.logt{border-collapse:collapse;font-size:.95rem;min-width:640px;width:100%;background:rgba(255,255,255,.4)}
.logt th,.logt td{border:1px solid var(--rule);padding:6px 8px;text-align:left;font-variant-numeric:tabular-nums}
.logt th{font-family:var(--f-ui);font-weight:400;background:var(--paper2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

  let grid=""; for(let i=0;i<=3;i++){ grid+=`<line x1="${i*30}" y1="0" x2="${i*30}" y2="90" stroke="#C9B48A" stroke-width="1"/><line x1="0" y1="${i*30}" x2="90" y2="${i*30}" stroke="#C9B48A" stroke-width="1"/>`; }
  const g = cells.map(([x,y,c])=>`<rect x="${x*30+1.5}" y="${y*30+1.5}" width="27" height="27" rx="4" fill="${c}"/>`).join("");
  return `<svg viewBox="-4 -4 98 98" width="${size||96}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${grid}<g transform="${T}">${g}</g></svg>`;
}
function barSVG(c){
  const W=360,H=250,L=56,B=200,T=24,cw=(W-L-16)/c.labels.length, step=(B-T)/10;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(c.title)} 막대그래프">`;
  for(let i=0;i<=10;i++){ const y=B-i*step; s+=`<line x1="${L}" y1="${y}" x2="${W-12}" y2="${y}" stroke="${i%5===0?'#A89170':'#D8C8A6'}" stroke-width="${i%5===0?1.6:1}"/>`;
    if(i%5===0) s+=`<text x="${L-10}" y="${y+6}" text-anchor="end" font-size="17" fill="#3A2E22" font-family="Jua,sans-serif">${i/5*c.per5}</text>`; }
  c.cells.forEach((n,i)=>{ const x=L+i*cw+cw*.22, w=cw*.56; s+= i===c.hide ? `<text x="${x+w/2}" y="${B-14}" text-anchor="middle" font-size="30" fill="#C2493B" font-family="Jua,sans-serif">?</text>` : `<rect x="${x}" y="${B-n*step}" width="${w}" height="${n*step}" fill="${[].concat(c.ask).includes(i)?'#C2493B':'#3F5596'}" rx="2"/>`; s+=`
    <text x="${x+w/2}" y="${B+24}" text-anchor="middle" font-size="18" fill="#3A2E22" font-family="Jua,sans-serif">${c.labels[i]}</text>`; });
  s+=`<line x1="${L}" y1="${T-6}" x2="${L}" y2="${B}" stroke="#3A2E22" stroke-width="2"/><line x1="${L}" y1="${B}" x2="${W-12}" y2="${B}" stroke="#3A2E22" stroke-width="2"/>
    <text x="8" y="16" font-size="15" fill="#3A2E22" font-family="Jua,sans-serif">(${c.unit})</text>
    <text x="${W-12}" y="16" text-anchor="end" font-size="16" fill="#3A2E22" font-family="Jua,sans-serif">${esc(c.title)}</text></svg>`;
  return s;
}
function calcHTML(rows){
  return `<table class="calc" aria-label="계산식 배열">${rows.map((r,i)=> r[0]==="⋮" ? `<tr><td>⋮</td><td></td><td>⋮</td></tr>` : `<tr class="${i===rows.length-1?'ask':''}"><td>${r[0]}</td><td class="eq">=</td><td>${r[1]}</td></tr>`).join("")}</table>`;
}

/* ---------- 새 그림 도우미 ---------- */
const INK="#3A2E22", RED="#C2493B", BLUE="#3F5596", RULE="#C9B48A";
function gridSVG(sh, size){
  let g=""; for(let i=0;i<=3;i++) g+=`<line x1="${i*30}" y1="0" x2="${i*30}" y2="90" stroke="${RULE}" stroke-width="1"/><line x1="0" y1="${i*30}" x2="90" y2="${i*30}" stroke="${RULE}" stroke-width="1"/>`;
  const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
  g+=sh.cells.map(c=>`<rect x="${c[0]*30+1.5}" y="${c[1]*30+1.5}" width="27" height="27" rx="4" fill="${same(c,sh.red)?RED:BLUE}"/>`).join("");
  return `<svg viewBox="-4 -4 98 98" width="${size||96}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${g}</svg>`;
}
const capBox=(svg,cap)=>`<div class="figcap">${svg}<span>${cap}</span></div>`;
function clockSVG(h, size){
  const c=60, r=50; let s=`<circle cx="${c}" cy="${c}" r="${r}" fill="#FFFDF6" stroke="${INK}" stroke-width="3"/>`;
  for(let k=0;k<12;k++){ const a=k*30*Math.PI/180, x1=c+Math.sin(a)*(r-3), y1=c-Math.cos(a)*(r-3), x2=c+Math.sin(a)*(r-(k%3?8:12)), y2=c-Math.cos(a)*(r-(k%3?8:12));
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${INK}" stroke-width="${k%3?1.5:3}"/>`; }
  [[12,0],[3,90],[6,180],[9,270]].forEach(([n,d])=>{ const a=d*Math.PI/180; s+=`<text x="${(c+Math.sin(a)*(r-22)).toFixed(1)}" y="${(c-Math.cos(a)*(r-22)+5).toFixed(1)}" text-anchor="middle" font-size="13" fill="${INK}" font-family="Jua,sans-serif">${n}</text>`; });
  const ha=h*30*Math.PI/180;
  s+=`<line x1="${c}" y1="${c}" x2="${c}" y2="${c-40}" stroke="${BLUE}" stroke-width="3.5" stroke-linecap="round"/>`;
  s+=`<line x1="${c}" y1="${c}" x2="${(c+Math.sin(ha)*27).toFixed(1)}" y2="${(c-Math.cos(ha)*27).toFixed(1)}" stroke="${RED}" stroke-width="5" stroke-linecap="round"/><circle cx="${c}" cy="${c}" r="4" fill="${INK}"/>`;
  return `<svg viewBox="0 0 120 120" width="${size||110}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}</svg>`;
}
function lineSVG(a,b){
  const O=[170,150], L=130, ray=d=>[O[0]+L*Math.cos(d*Math.PI/180), O[1]-L*Math.sin(d*Math.PI/180)];
  const lab=(d,t,big)=>{ const p=[O[0]+52*Math.cos(d*Math.PI/180), O[1]-52*Math.sin(d*Math.PI/180)]; return `<text x="${p[0].toFixed(1)}" y="${(p[1]+7).toFixed(1)}" text-anchor="middle" font-size="${big?26:19}" fill="${big?RED:INK}" font-family="Jua,sans-serif">${t}</text>`; };
  const r1=ray(a), r2=ray(a+b);
  return `<svg viewBox="0 0 340 175" width="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="일직선 위의 세 각">
    <line x1="20" y1="150" x2="320" y2="150" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
    <line x1="${O[0]}" y1="${O[1]}" x2="${r1[0].toFixed(1)}" y2="${r1[1].toFixed(1)}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
    <line x1="${O[0]}" y1="${O[1]}" x2="${r2[0].toFixed(1)}" y2="${r2[1].toFixed(1)}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${O[0]}" cy="${O[1]}" r="4" fill="${INK}"/>${lab(a/2,a+"°")}${lab(a+b/2,b+"°")}${lab((a+b+180)/2,"?",true)}</svg>`;
}
function doorsHTML(angs){
  const L=["가","나","다","라","마"];
  return `<div class="doors">${angs.map((a,i)=>`<div class="figcap">${angleSVG(a)}<span>${L[i]} · ${a}°</span></div>`).join("")}</div>`;

const MOVE={ id:p=>p, fx:([x,y])=>[2-x,y], fy:([x,y])=>[x,2-y], r90:([x,y])=>[2-y,x], r180:([x,y])=>[2-x,2-y], r270:([x,y])=>[y,2-x] };

const MOVE_DID={fx:"오른쪽으로 뒤집은", fy:"위쪽으로 뒤집은", r90:"시계 방향으로 90° 돌린", r180:"시계 방향으로 180° 돌린", r270:"시계 반대 방향으로 90° 돌린"};
const MOVE_WHY={fx:"오른쪽(왼쪽)으로 뒤집으면 왼쪽과 오른쪽만 바뀌어.", fy:"위쪽(아래쪽)으로 뒤집으면 위와 아래만 바뀌어.", r90:"시계 방향 90°는 위쪽(빨간 칸 쪽)이 오른쪽으로 가.", r180:"180° 돌리면 위아래와 왼쪽·오른쪽이 모두 바뀌어.", r270:"시계 반대 방향 90°는 위쪽이 왼쪽으로 가."};
function applyMoves(sh, ms){ return ms.reduce((s,m)=>({cells:s.cells.map(MOVE[m]), red:MOVE[m](s.red)}), sh); }
const keyOf=s=>s.cells.map(c=>c.join(",")).sort().join(";")+"|"+s.red.join(",");
function randShape(){
  for(;;){
    const all=[]; for(let y=0;y<3;y++) for(let x=0;x<3;x++) all.push([x,y]);
    const n=R(4,5), cells=shuffle(all).slice(0,n);
    const has=(x,y)=>cells.some(c=>c[0]===x&&c[1]===y);
    const seen=new Set([cells[0].join()]), st=[cells[0]];
    while(st.length){ const [x,y]=st.pop(); [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ const k=[x+dx,y+dy].join(); if(has(x+dx,y+dy)&&!seen.has(k)){ seen.add(k); st.push([x+dx,y+dy]); } }); }
    if (seen.size!==n) continue;
    const sh={cells, red:pk(cells)};
    const keys=new Set(["id","fx","fy","r90","r180","r270","fx r90","fx r270"].map(m=>keyOf(applyMoves(sh,m.split(" ")))));
    if (keys.size===8) return sh;
  }
}

    return {say:say(`이 모양을 ${MOVE_DID[a].replace("뒤집은","뒤집고")}, 그다음 ${MOVE_DID[b]} 모양을 골라라.`), vis:start, q:"두 번 움직인 뒤의 모양은?", opts:[shapeOpt(sh,[a,b],"c"),shapeOpt(sh,[b,a],"w","순서를 바꿨어. 먼저 뒤집고 그다음에 돌려야 해."),shapeOpt(sh,[a],"w","뒤집기만 하고 돌리기를 하지 않았어.")], ex:`먼저 ${MOVE_NAME[a]}, 그다음 ${MOVE_NAME[b]}. ${MOVE_WHY[b]}`, rule:"제4장 2·4번 규칙", two:true}; }

}

  const unit=pk([[2],[5,10],[5,10],[10,20],[2,5,10]][t-1]);
  const cells=shuffle([2,3,4,5,6,7,8,9,10]).slice(0,4);
  const labels=kind==="milk"?CLASSES:SEASONS, u=kind==="milk"?"갑":"명", title=kind==="milk"?"반별 남은 우유":"좋아하는 계절";
  const ob=kind==="milk"?"":"을";
  const head=`눈금 5칸이 ${unit*5}${u} → 한 칸은 ${unit}${u}.`;
  const vis={type:"bar",title,unit:u,labels,cells,per5:unit*5,ask:[]};
  const W=(v,why)=>[`${v}${u}`,why];
  if (t<=2){ const i=R(0,3), v=cells[i]*unit; vis.ask=[i];
    return {say:say(kind==="milk"?`${labels[i]}에 남은 우유는 몇 갑이지?`:`${labels[i]}을 좋아하는 학생은 몇 명이지?`), vis, q:kind==="milk"?`${labels[i]}에 남은 우유는 몇 갑일까?`:`${labels[i]}을 좋아하는 학생은 몇 명일까?`,
      opts:opts3(`${v}${u}`,[W(cells[i],`칸 수만 셌어. 한 칸은 ${unit}${u}이야.`),W(v+unit,"칸을 하나 더 셌어."),W(v-unit,"칸을 하나 덜 셌어.")]), ex:`${head} ${labels[i]}은 ${cells[i]}칸 → ${unit}×${cells[i]}=${v}${u}`, rule:"제5장 1·2번 규칙"}; }
  if (t===3){ let i,j; do{ i=R(0,3); j=R(0,3); }while(i===j||cells[i]<=cells[j]); const dc=cells[i]-cells[j], v=dc*unit; vis.ask=[i,j];
    const q=kind==="milk"?`${labels[i]}은 ${labels[j]}보다 우유가 몇 갑 더 남았을까?`:`${labels[i]}${ob} 좋아하는 학생은 ${labels[j]}보다 몇 명 더 많을까?`;
    return {say:say(q), vis, q, opts:opts3(`${v}${u}`,[W(dc,`칸 수의 차이만 구했어. 한 칸은 ${unit}${u}이야.`),W(cells[i]*unit,"더 많은 쪽의 수만 읽었어. 두 수의 차이를 구해야 해."),W(v+unit,"칸을 하나 더 셌어.")]), ex:`${head} ${dc}칸 차이 → ${unit}×${dc}=${v}${u}`, rule:"제5장 1·3번 규칙"}; }
  if (t===4){ const sum=cells.reduce((a,b)=>a+b,0), v=sum*unit, mi=cells.indexOf(Math.min(...cells));
    const q=kind==="milk"?"네 반에 남은 우유는 모두 몇 갑일까?":"조사한 학생은 모두 몇 명일까?";
    return {say:say(q), vis, q, opts:opts3(`${v}${u}`,[W(sum,`칸 수를 모두 더했어. 한 칸은 ${unit}${u}이야.`),W(v-cells[mi]*unit,"한 항목을 빠뜨렸어. 네 막대를 모두 더해."),W(v+unit*2,"칸 수를 다시 세어 봐.")]), ex:`${head} 모두 ${cells.join("+")}=${sum}칸 → ${unit}×${sum}=${v}${u}`, rule:"제5장 1번 규칙"}; }
  const hid=R(0,3), total=cells.reduce((a,b)=>a+b,0)*unit, v=cells[hid]*unit, rest=total-v; vis.hide=hid;
  const q=kind==="milk"?`네 반에 남은 우유가 모두 ${total}갑이다. ${labels[hid]}에 남은 우유는 몇 갑일까?`:`조사한 학생이 모두 ${total}명이다. ${labels[hid]}${ob} 좋아하는 학생은 몇 명일까?`;
  return {say:say(`${labels[hid]} 막대가 지워졌다! 전체 수로 찾아라.`), vis, q, opts:opts3(`${v}${u}`,[W(total-(cells.reduce((a,b)=>a+b,0)-cells[hid]),`나머지 막대를 칸 수 그대로 뺐어. 한 칸은 ${unit}${u}이야.`),W(rest,"보이는 막대의 합을 답으로 골랐어. 전체에서 빼야 해."),W(v+unit,"계산을 다시 확인해.")]),
    ex:`${head} 보이는 막대 합: ${rest}${u}. 전체 ${total}−${rest}=${v}${u}`, rule:"제5장 1·2번 규칙"};
}

};
const sigOf=p=>p.q+"|"+p.opts[0][0]+"|"+JSON.stringify(p.vis||"");
function makeP(key,t,avoid,arg){
  let p; for(let k=0;k<30;k++){ p=TYPES[key][t-1](t,arg); if (p && p.opts && !avoid.includes(sigOf(p))) break; }
  return p;
}

/* ---------- 심화 봉인: 회차마다 새로 만들기 (봉인마다 유형 2~3가지, 직전 회차와 다른 유형·수치) ---------- */
function opts4(ans, cands, draw0){
  const out=[[String(ans),"c",draw0]], seen=new Set([String(ans)]);
  for (const c of cands){ const lab=String(c[0]);
    if (seen.has(lab) || /NaN|undefined|Infinity|^-|^0°|^0명|^0$/.test(lab) || (typeof c[0]==="number" && c[0]<=0)) continue;
    seen.add(lab); out.push([lab,"w",c[2],c[1]]); if (out.length===4) break; }
  return out.length===4 ? out : null;
}
/* 숫자 뒤 조사: 읽는 소리의 받침으로 고르기 (40→사십→으로, 16→십육→을) */
function lastSound(n){ n=Math.abs(n); const u=n%10; if (u) return ["","일","이","삼","사","오","육","칠","팔","구"][u];
  if (n%100) return "십"; if (n%1000) return "백"; if (n%10000) return "천"; return "만"; }
function jong(n){ const c=lastSound(n).charCodeAt(0)-0xAC00; return c%28; }
const eul=n=>jong(n)?"을":"를", ro=n=>{ const j=jong(n); return j===0||j===8?"로":"으로"; }, ieot=n=>jong(n)?"이었다":"였다";

function getMeta(){ const m=store.get(META,null)||{}; return {runs:m.runs||0, done:m.done||0, hp:m.hp||0, revealed:m.revealed||[], hintLog:m.hintLog||[], clues:m.clues||[], curSig:m.curSig||{}, hist:m.hist||[]}; }
const putMeta=m=>store.set(META,m);
const tierOf=n=>Math.min(5,1+Math.floor(n/3));
const curTier=()=>tierOf(store.get(DEX,[]).length);
const hintsOn=m=>m.done>0 || store.get(DEX,[]).length>0;
function fresh(){ return {v:3, i:0, keys:0, weird:0, first:0, retryOk:0, wrongN:0, allies:[], route:null, branch:null, items:{}, flags:{}, routeLines:[], branchLines:[], ch:1, log:[], rec:{}, mode:"scene", sub:null, newCh:false, gen:{}, tier:1, run:1, prevSig:{}, hintId:null, allDone:false}; }
function save(){ if(S) store.set(SAVE, S); }
/* 못 본 결말을 차례로 하나씩: 앞 회차와 다른 결말부터, 한 바퀴 돌면 다시 처음부터 */
function nextHint(m){
  const got=store.get(DEX,[]), un=Object.keys(ENDINGS).filter(id=>!got.includes(id));
  if (!un.length) return null;
  const fresh1=un.filter(id=>!m.revealed.includes(id));
  const last=m.hintLog.length?m.hintLog[m.hintLog.length-1].id:null;
  let id;
  if (fresh1.length) id=pk(fresh1.filter(x=>x!==last).length?fresh1.filter(x=>x!==last):fresh1);
  else { const pool=un.filter(x=>x!==last); id=(pool.length?pool:un)[m.hp % (pool.length||un.length)]; m.hp++; }
  if (!m.revealed.includes(id)) m.revealed.push(id);
  m.hintLog.push({run:m.runs, id});
  return id;
}
function startRun(){
  const m=getMeta(), show=hintsOn(m); m.runs++;
  S=fresh(); S.run=m.runs; S.tier=curTier(); S.prevSig=m.curSig||{}; m.curSig={};
  S.allDone = store.get(DEX,[]).length>=END_TOTAL;
  S.hintId = show && !S.allDone ? nextHint(m) : null;
  putMeta(m);
  genScenes([0,1,2,3,4,5,7,8,9], S.tier);
  prepareSeals();
  store.del(SAVE); S.mode="scene"; $lay.hidden=true; render();
}
/* 이전 버전 저장 이어 하기 */
const OLD_BRANCH={gate:{bold:"help",safe:"rush"},roof:{bold:"balloon",safe:"stairs"},basement:{bold:"unknown",safe:"exit"}};
function loadSave(){
  let sv=store.get(SAVE,null);
  if (!sv || !sv.mode || sv.mode==="ending"){ const old=store.get(OLDSAVE,null); sv = old && old.mode && old.mode!=="ending" ? old : (sv&&sv.mode!=="ending"?sv:null); }
  if (!sv || !sv.mode || sv.mode==="ending") return null;
  if (sv.v===3) return sv;
  const n=Object.assign(fresh(), sv); n.v=3; n.items=sv.items||{}; n.flags=sv.flags||{}; n.rec=sv.rec||{};
  n.tier=sv.tier||curTier(); n.run=sv.run||Math.max(1,getMeta().runs); n.prevSig={};
  if (n.route && OLD_BRANCH[n.route] && OLD_BRANCH[n.route][sv.branch]) n.branch=OLD_BRANCH[n.route][sv.branch];
  const keep=n.gen||{}; n.gen={};
  S=n;
  const idx=[]; for(let k=0;k<10;k++) if (k>=n.i) idx.push(k);
  genScenes(idx.filter(k=>k!==6 || n.route), n.tier);
  if (["result","retry","retryResult"].includes(n.mode)) n.mode="scene";
  if (n.mode==="hard"||n.mode==="hardResult") { n.mode="gateChoice"; n.hard=null; }
  return n;
}

/* ---------- 화면 공통 ---------- */
function hud(){
  const sc = S.i<=9 ? cur() : SCENES[9];
  const place = typeof sc.place==="string" ? sc.place : sc.place[vkey()||"gate"];
  const dots = [0,1,2].map(k=>`<i class="${k<S.weird?'on':''}"></i>`).join("");
  const where = S.hard ? `심화 봉인 ${Math.min(S.hard.i+1,6)} / 6`
    : S.mode==="routeSelect" ? `${S.i+1} / 10 · 첫 번째 갈림길` : S.mode==="branchSelect" ? `${S.i+1} / 10 · 두 번째 갈림길` : S.mode==="finale"||S.mode==="gateChoice" ? "마지막 문 앞"
    : `${S.i+1} / 10 · ${esc(place)}${S.route?` · ${ROUTE_TEXT[S.route].name}`:""}`;
  return `<div class="hud" role="status">
    <span class="where">${where}</span>
    <span class="stat">${S.run}번째 밤</span>
    <span class="stat" title="열쇠 조각"><span class="keyico" aria-hidden="true"></span>열쇠 ${S.keys}</span>
    <span class="stat" title="문제 난이도">${S.hard?"심화":`난이도 ${S.tier}`}</span>
    <span class="stat" title="이상해진 정도">동화 <span class="dots" aria-label="${S.weird}/3">${dots}</span></span>
    <button class="bookbtn ${S.newCh?'new':''}" type="button" data-act="book">규칙서</button>
  </div>`;
}
function storyHTML(lines){ return `<div class="story">${lines.map(l=>`<p class="fade">${l}</p>`).join("")}</div>`; }
function introLines(sc){
  if (Array.isArray(sc.intro)) return sc.intro;
  const k=vkey()||"gate";
  return (sc.intro[k]||sc.intro.gate).concat(sc.intro.all||[]);
}
function optsHTML(opts, two){
  const lab = ["가","나","다","라"];
  const list = shuffle(opts.map((o,k)=>({o,k})));
  const pic = list.some(({o})=>o[2]!=null && typeof o[2]!=="number" && o[1]!=="x");
  return `<div class="opts ${two||pic?'two':''}">${list.map(({o,k},j)=>{
    const d = o[1]!=="x" ? o[2] : null;
    const shape = d && (typeof d==="string" || d.grid);
    const vis = d!=null ? `<span class="ov">${drawOpt(d)}</span>` : "";
    return `<button class="opt" type="button" data-pick="${k}"><span class="tag" aria-hidden="true">${lab[j]}</span>${vis}<span class="ot">${shape?"이 모양":esc(o[0])}</span></button>`;
  }).join("")}</div>`;
}
function visHTML(v){ if(!v) return ""; return `<div class="vis">${typeof v==="object" ? visObj(v) : VIS[v]()}</div>`; }
const pickedHTML=(o)=>{ const d=o&&o[1]!=="x"?o[2]:null; return d && (typeof d==="string"||d.grid||d.clock!=null) ? `<span class="ov inline">${drawOpt(d,80)}</span>${d.clock!=null?` <b>${esc(o[0])}</b>`:""}` : `<b>${esc(o?o[0]:"")}</b>`; };
const answerHTML=(o)=>pickedHTML(o);

/* ---------- 엔딩 판정 ----------
   우선순위
   1) 진행 중: 동화 3 → E8(1~3번째 장소)·E9(4~7번째)·E10(8번째 이후)
   2) 마지막 문에서 엉뚱한 선택 + 학교의 비밀(시계탑·지하 기록)을 본 적 있음 → E13
   3) 열 문제를 모두 처음에 맞힘 → E12
   4) 경로 결말: 정문(E1·E2·E3) / 옥상 열기구(E4·E5) / 옥상 비상계단(E2·E3) / 지하(E6·E7)
   5) 탈출 결말인데 동화 2 → E11
   6) 탈출 결말이면 심화 봉인 도전 가능: 6개 → E14, 5개 → E15, 그 밖 → 4·5의 결말 */
function clueKnown(){ const m=getMeta(); return m.clues.includes("tower")||m.clues.includes("record")||S.items.tower||S.items.record; }
function routeEnding(){
  const k=S.keys, it=S.items;
  if (S.route==="gate"){ const mk=it.masterkey?2:0;
    if (S.branch==="help" && k>=16-mk) return "E1";
    return k>=12-mk ? "E2" : "E3"; }
  if (S.route==="roof"){
    if (S.branch==="stairs") return k>=12 ? "E2" : "E3";
    const helped = it.tower || S.allies.includes("수위 아저씨") || S.allies.length>=7;

  } else if (v==="roof"){
    const guard=S.allies.includes("수위 아저씨");
    S.routeLines=["옥상으로 올라가는 계단에 불이 하나씩 켜진다.", guard?`수위 아저씨가 앞장서서 녹슨 옥상 문을 열어 준다. ${say("여기서 보면 학교 전체가 보여.")}`:"녹슨 옥상 문을 어깨로 밀어 겨우 열었다.","옥상에서 내려다보니 운동장에 거대한 각도기 무늬가 그려져 있다. 땅에서는 보이지 않던 무늬다."];
  } else {
    if (S.keys>=10){ S.keys-=3; S.flags.ladder=true; S.routeLines=["지하로 내려가는 녹슨 사다리가 삐걱거린다.","주머니 속 열쇠 조각이 무거워 사다리가 휘청! 열쇠 조각 3개가 어둠 속으로 떨어졌다.","벽에 오래된 낙서가 보인다. '먼저 나간 아이 다녀감.'"]; }
    else S.routeLines=["지하로 내려가는 녹슨 사다리가 삐걱거린다.","몸이 가벼워 사다리를 무사히 내려왔다.","벽에 오래된 낙서가 보인다. '먼저 나간 아이 다녀감.'"];
  }
  genScenes([6], S.tier);
  S.mode="route"; render();
}
function chooseBranch(v){
  const b=BRANCH[S.route]; if (S.branch || (v!==b.a.id && v!==b.b.id)) return;
  S.branch=v; const it=S.items;
  const c = b.a.id===v ? b.a : b.b;
  if (c.ally) S.allies.push(c.ally);
  if (v==="rush"){
    if (S.flags.chain1 && it.masterkey) S.branchLines=["열쇠를 꽂자 쇠사슬이 모두 풀렸다!","이제 교문 자물쇠의 계산식만 남았다. 강당을 지나 교문으로 간다."];
    else if (S.keys>=12){ S.keys-=2; S.branchLines=["열쇠 조각 두 개를 녹여 쇠사슬 하나를 끊었다. 주머니가 조금 가벼워졌다.","교실 쪽 아이들의 목소리가 점점 멀어진다."]; }
    else S.branchLines=["열쇠 조각이 모자라 쇠사슬이 그대로다.","교실 쪽 아이들의 목소리가 멀어진다. 강당을 지나 다른 문을 찾아야 한다."];
  } else if (v==="help") S.branchLines=["교실 구석에서 울고 있던 아이를 찾았다.",`${say("나도 데려가 줘. 여기서 너무 오래 기다렸어.")} 아이의 손은 따뜻하다.`];
  else if (v==="balloon") S.branchLines=[it.tower?"시계탑에서 본 비밀이 떠오른다. 이 학교의 시간은 거꾸로 흐른다. 밧줄도 거꾸로 감아야 할지 모른다.":S.allies.includes("수위 아저씨")?"수위 아저씨가 손전등으로 찢어진 곳을 비춰 준다.":"찢어진 천을 혼자 꿰매기 시작했다. 손이 모자라다.","화단 쪽에서 정원사 할머니가 나타나 굵은 실을 건넨다."];
  else if (v==="stairs") S.branchLines=["열기구를 두고 비상계단으로 내려간다.","계단 끝은 정문 옆 쪽문으로 이어진다고, 벽에 화살표가 그려져 있다."];
  else if (v==="unknown"){ S.items.record=true; S.branchLines=["규칙서에 없는 문 뒤는 오래된 기록실이었다.","먼지 쌓인 출석부에 낯익은 글씨가 있다. 맨 마지막 줄의 이름은… 잘 보이지 않는다.",`출석부를 정리하던 아이가 고개를 든다. ${say("같이 나가자. 이 출석부에 비밀 통로 위치도 적혀 있어.")}`]; }
  else S.branchLines=["초록 불빛을 따라 걷는다. 보일러 소리가 점점 커진다.", it.map?"배관 지도에 이 길 끝 철문이 표시되어 있다.":"지도 없이 걷자니 발밑이 자꾸 미끄럽다."];
  S.mode="branchResult"; render();
}
function goNext(){
  if (S.i>=9){ S.mode="finale"; return render(); }
  S.i++;
  if (S.i===6 && !S.gen[6] && S.route) genScenes([6], S.tier);
  if (S.i!==6 || S.route){ const ch = (cur().ch||0)+1; if (ch>S.ch){ S.ch=ch; S.newCh=true; } }
  if (S.i===5 && !S.route){ S.mode="routeSelect"; return render(); }
  S.mode = (S.i===8 && !S.branch) ? "branchSelect" : "scene";
  render();
}
function optLabel(o){ return o[2]&&(typeof o[2]==="string"||o[2].grid) ? "고른 그림" : o[0]; }
function ansLabel(o){ return o[2]&&(typeof o[2]==="string"||o[2].grid) ? "그림 정답은 다시 도전 화면에서 확인" : o[0]; }
function pick(k){
  if (S.mode==="scene"){
    const sc = cur(), o = sc.opts[k]; if (!o) return;
    S.sub = {kind:o[1], k};
    if (o[1]==="c"){
      S.keys+=2; S.first++; S.rec[S.i]={u:sc.unit, r:"first"}; S.log.push({q:sc.q, ok:true});
      if (S.i<9) S.allies.push(allyName(S.i));
      if (S.i===6) S.items[ROUTE6[S.route].item]=true;
      S.mode="result";
    } else if (o[1]==="w"){
      S.rec[S.i]={u:sc.unit, r:null};
      S.log.push({q:sc.q, ok:false, pick:optLabel(o), ans:ansLabel(sc.opts[0]), why:o[3], ex:sc.hint[1], first:true});
      S.mode="result";
    } else {
      S.weird++; S.rec[S.i]={u:sc.unit, r:null};
      if (S.i===9 && clueKnown()) return finish("E13");
      if (S.weird>=3) return finish(S.i<=2 ? "E8" : S.i<=6 ? "E9" : "E10");
      S.mode="result";
    }
  } else if (S.mode==="retry"){
    const sc=cur(), o = sc.retry.opts[k]; if (!o) return;
    S.sub.rkind = o[1]; S.sub.rk = k;
    if (o[1]==="c"){ S.keys+=1; S.retryOk++; S.rec[S.i]={u:sc.unit, r:"retry"}; if (S.i===6) S.items[ROUTE6[S.route].item]=true; }
    else { S.keys=Math.max(0,S.keys-1); S.wrongN++; S.rec[S.i]={u:sc.unit, r:"wrong"};
      S.log.push({q:sc.retry.q, ok:false, pick:optLabel(o), ans:ansLabel(sc.retry.opts[0]), why:o[3], ex:sc.retry.ex}); }
    S.mode="retryResult";
  } else if (S.mode==="hard"){
    const h = sealAt(S.hard.i), o = h.opts[k]; if (!o) return;
    S.hard.last = o[1];
    if (o[1]!=="c"){ S.hard.wrong++; S.log.push({q:h.q, ok:false, pick:optLabel(o), ans:ansLabel(h.opts[0]), ex:h.ex}); }
    else S.hard.ok++;
    S.mode="hardResult";
  } else return;
  render();
}

/* 연속 클릭으로 상태가 꼬이지 않도록 잠깐 잠근다 */
let lock=false;
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-pick],[data-choice],[data-act]"); if(!t) return;
  const act=t.dataset.act, soft=["book","dex","qr","log","closeLay"].includes(act);
  if (!soft){ if (lock) return; lock=true; setTimeout(()=>lock=false, 350); }
  if (t.dataset.pick!=null){ pick(+t.dataset.pick); return; }
  if (t.dataset.choice!=null){ if (S.mode==="routeSelect") chooseRoute(t.dataset.choice); else if (S.mode==="branchSelect") chooseBranch(t.dataset.choice); return; }
  if (act==="start"||act==="restart") startRun();
  else if (act==="resume"){ const sv=loadSave(); if (sv){ S=sv; render(); } else startRun(); }
  else if (act==="book") openBook();
  else if (act==="dex") openDex();
  else if (act==="log") openLog();
  else if (act==="qr") openQR();
  else if (act==="closeLay") $lay.hidden=true;
  else if (act==="toScene" && ["route","branchResult"].includes(S.mode)){ S.mode="scene"; render(); }
  else if (act==="toRetry" && S.mode==="result"){ S.mode="retry"; render(); }
  else if (act==="nextScene" && ["result","retryResult"].includes(S.mode)) goNext();
  else if (act==="toGate" && S.mode==="finale"){ S.mode="gateChoice"; render(); }
  else if (act==="toEnd" && S.mode==="finale") finish(S.base);
  else if (act==="leave" && S.mode==="gateChoice") finish(S.base);
  else if (act==="challenge" && S.mode==="gateChoice"){ S.hard={i:0, wrong:0, ok:0, last:null}; S.mode="hard"; render(); }
  else if (act==="hardNext" && S.mode==="hardResult"){ S.hard.i++; S.mode="hard"; render(); }
  else if (act==="hardEnd" && S.mode==="hardResult") hardEnd();
});
$lay.addEventListener("click", e=>{ if(e.target===$lay) $lay.hidden=true; });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") $lay.hidden=true; });

/* 테스트용 */
window.__vis = visObj;
window.__game = {SCENES, ENDINGS, TYPES, HARD, SEALS, makeSeals, cur:()=>cur(), decideEnding:()=>decideEnding(), getMeta, makeP, sigOf, applyMoves, keyOf, get S(){return S;}, set S(v){S=v;}, _unlock(){ lock=false; }};
render();
})();

</script>
