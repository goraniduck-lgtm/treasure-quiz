<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 마을 문제 해결단</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
:root{
  --ground:#EAF3E6; --paper:#FFFFFF; --paper-2:#F4F8F1; --ink:#1E3328; --ink-2:#51685A;
  --line:#CCDCC8; --leaf:#2E8553; --on-leaf:#FFFFFF; --leaf-soft:#D8EFDF;
  --sun:#E9A817; --sun-soft:#FFF0C7; --sky:#2F7DBA; --sky-soft:#DDEBF7;
  --brick:#C94F35; --brick-soft:#FBE2DA;
  --shadow:0 1px 0 rgba(30,51,40,.06),0 10px 28px -12px rgba(30,51,40,.22);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101913; --paper:#1A261F; --paper-2:#1F2D25; --ink:#E3EFE6; --ink-2:#A6BBAD;
    --line:#33463A; --leaf:#62C98C; --on-leaf:#0E1A12; --leaf-soft:#1E3E2B;
    --sun:#F4C654; --sun-soft:#3A3118; --sky:#80BCEB; --sky-soft:#1B3245;
    --brick:#EF8A70; --brick-soft:#40231B;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101913; --paper:#1A261F; --paper-2:#1F2D25; --ink:#E3EFE6; --ink-2:#A6BBAD;
  --line:#33463A; --leaf:#62C98C; --on-leaf:#0E1A12; --leaf-soft:#1E3E2B;
  --sun:#F4C654; --sun-soft:#3A3118; --sky:#80BCEB; --sky-soft:#1B3245;
  --brick:#EF8A70; --brick-soft:#40231B;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.badge{width:48px;height:48px;border-radius:14px;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center;flex:none}
.badge svg{width:30px;height:30px}
.brand h1{font-size:clamp(24px,4vw,32px)}
.brand small{display:block;color:var(--ink-2);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select.pick{appearance:none;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:9px 34px 9px 12px;font-size:15px;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}

.btn{border:2px solid transparent;border-radius:14px;padding:10px 18px;font-family:var(--display);font-size:18px;display:inline-flex;align-items:center;gap:8px;transition:transform .12s, box-shadow .12s;line-height:1.2}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--leaf);color:var(--on-leaf);box-shadow:0 4px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.btn.primary:active{box-shadow:0 2px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.btn.sun{background:var(--sun);color:#2A2004;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn.ghost{background:var(--paper);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--leaf)}
.btn svg{width:20px;height:20px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* confirm */
/* class bar */
.classbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--paper);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.classbar .now{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:8px}
.classbar .now i{font-style:normal;background:var(--leaf);color:var(--on-leaf);border-radius:10px;padding:2px 12px}
.classbar .lbl{color:var(--ink-2);font-size:15px}
.picker{flex-direction:column;align-items:stretch;gap:14px;padding:clamp(18px,3vw,28px);border:3px solid var(--sun)}
.picker h2{font-size:clamp(24px,3.4vw,30px)}
.cls-grid{display:flex;flex-wrap:wrap;gap:10px}
.cls-btn{font-family:var(--display);font-size:20px;border:2px solid var(--line);background:var(--paper-2);border-radius:14px;padding:12px 18px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.cls-btn small{font-family:var(--body);font-size:13px;color:var(--ink-2)}
.cls-btn:hover,.cls-btn.cur{border-color:var(--leaf);background:var(--leaf-soft)}
.addrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.addrow select,.addrow input{font-size:18px;background:var(--paper-2);border:2px solid var(--line);border-radius:12px;padding:8px 10px;width:auto}
.addrow input[type=text]{width:5em;padding:8px 10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-family:var(--display);font-size:16px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tab b{font-weight:400;opacity:.7;margin-left:4px}
.offline{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--brick);color:#fff;text-align:center;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;font-family:var(--display)}
.mini.like[aria-pressed="true"]{background:var(--sun);color:#2A2004}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.idea{border:2px solid var(--line);border-radius:16px;background:var(--paper-2);padding:12px;display:flex;flex-direction:column;gap:8px}
.idea-h{display:flex;gap:8px;align-items:center}
.idea-n{font-family:var(--display);color:var(--leaf);white-space:nowrap}
.idea-h input[type=text]{padding:6px 10px;font-size:16px;flex:1;min-width:0}
.idea textarea{min-height:90px;background:var(--paper)}
.idea.add{border-style:dashed;align-items:center;justify-content:center;min-height:120px;font-family:var(--display);font-size:20px;color:var(--leaf);cursor:pointer}
.idea.add:hover{border-color:var(--leaf)}
.mini-x{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:3px 10px;font-size:14px;white-space:nowrap}
.ex{background:var(--sun-soft);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.7}
.ex b{font-family:var(--display);font-weight:400}
.pos{color:var(--leaf)}.neg{color:var(--brick)}
.cmp-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:16px;background:var(--paper)}
.cmp{border-collapse:collapse;width:100%;min-width:760px;font-size:15px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px;vertical-align:top;text-align:left}
.cmp tr>*:last-child{border-right:0}
.cmp tr:first-child th{background:#9B7A4E;color:#FFF8EC;font-family:var(--display);font-weight:400;font-size:15px;text-align:center;vertical-align:middle;line-height:1.3}
.cmp th[scope=row]{font-family:var(--display);font-weight:400;font-size:17px;background:var(--sun-soft);width:22%}
.cmp th[scope=row] small{display:block;font-family:var(--body);font-size:13px;color:var(--ink-2)}
.cmp tr.pick th[scope=row],.cmp tr.pick td{background:var(--leaf-soft)}
.cmp textarea{min-height:58px;font-size:15px;padding:6px 8px;border-radius:10px;margin-bottom:6px}
.cmp-t{display:block;margin-bottom:4px}
.cmp-s{white-space:nowrap;color:var(--sun);letter-spacing:1px}.cmp-s.neg{color:var(--brick)}
.cmp-tot{font-family:var(--display);font-size:19px;text-align:center!important;white-space:nowrap;vertical-align:middle!important}
.cmp-tot small{display:block;font-family:var(--body);font-size:12px;color:var(--leaf)}
.cmp-badge{display:inline-block;background:var(--leaf);color:var(--on-leaf);font-family:var(--display);font-size:12px;border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:2px}
.stars{display:inline-flex;align-items:center;gap:0;white-space:nowrap}
.stars b{font-family:var(--display);font-weight:400;color:var(--leaf);margin-right:2px;font-size:18px}
.stars.neg b{color:var(--brick)}
.stars button{border:0;background:none;padding:2px;font-size:22px;line-height:1;color:var(--line);cursor:pointer}
.stars button[aria-pressed="true"]{color:var(--sun)}
.stars.neg button[aria-pressed="true"]{color:var(--brick)}
.pickbtn{border:2px solid var(--leaf);background:var(--paper);color:var(--leaf);border-radius:12px;padding:6px 10px;font-family:var(--display);font-size:15px;cursor:pointer;white-space:nowrap}
.pickbtn[aria-pressed="true"]{background:var(--leaf);color:var(--on-leaf)}
.slide .cmp-wrap{max-width:100%;text-align:left}.slide .cmp{font-size:clamp(14px,1.6vw,20px)}
.card .cmp-wrap{font-size:14px}
@media (max-width:520px){.stone .dot{width:40px;height:40px;font-size:18px}.stone .lab{font-size:12px}.path::before{top:24px}}
.wall-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.post .cls{font-size:12px;font-family:var(--display);color:var(--sky);background:var(--sky-soft);border-radius:6px;padding:0 8px;align-self:flex-start}
.confirm{background:var(--sun-soft);border:2px solid var(--sun);border-radius:16px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}

/* stepper: stepping stones on a path */
.path{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 0}
.path::before{content:"";position:absolute;left:8%;right:8%;top:30px;border-top:4px dashed var(--line);z-index:0}
.stone{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink-2)}
.stone .dot{width:50px;height:50px;border-radius:50% 50% 46% 54%/55% 50% 50% 45%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--ink-2);transition:all .2s}
.stone .lab{font-family:var(--display);font-size:15px;text-align:center;line-height:1.2}
.stone.done .dot{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.stone.on .dot{background:var(--sun);border-color:var(--sun);color:#2A2004;transform:scale(1.12)}
.stone.on .lab{color:var(--ink)}

/* panels */
.panel{background:var(--paper);border-radius:24px;box-shadow:var(--shadow);padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:22px}
.stephead{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--display);font-size:15px;letter-spacing:.06em;color:var(--leaf)}
.stephead h2{font-size:clamp(24px,3.4vw,32px)}
.stephead p{color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.q{display:flex;flex-direction:column;gap:10px}
.q h3{font-size:20px;display:flex;gap:10px;align-items:baseline}
.q h3 .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sky-soft);color:var(--sky);display:inline-grid;place-items:center;font-size:16px}
.guide{font-size:15px;color:var(--ink-2)}
.frame{background:var(--paper-2);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:15px;color:var(--ink-2)}
.frame b{color:var(--ink);font-weight:400;background:var(--sun-soft);padding:0 4px;border-radius:4px}

textarea,input[type=text]{width:100%;background:var(--paper-2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;resize:vertical;line-height:1.6}
textarea:focus,input[type=text]:focus{border-color:var(--leaf);outline:none;background:var(--paper)}
textarea{min-height:92px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-size:16px;display:inline-flex;gap:6px;align-items:center;line-height:1.3;text-align:left}
.chip::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.chip[aria-pressed="true"]{background:var(--leaf-soft);border-color:var(--leaf)}
.chip[aria-pressed="true"]::before{background:var(--leaf);border-color:var(--leaf);box-shadow:inset 0 0 0 3px var(--leaf-soft)}

/* scene */
.scene{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:3/2;max-width:100%;background:linear-gradient(180deg,var(--scene-sky),color-mix(in srgb,var(--scene-sky) 60%,#fff));}
.scene .sunc{position:absolute;right:12%;top:12%;width:16%;aspect-ratio:1;border-radius:50%;background:var(--scene-sunc,#FFE07A);box-shadow:0 0 0 12px color-mix(in srgb,var(--scene-sunc,#FFE07A) 30%,transparent)}
.scene .hill{position:absolute;border-radius:50%;background:var(--scene-hill)}
.scene .h1{left:-20%;bottom:-38%;width:90%;height:70%;filter:brightness(.93)}
.scene .h2{right:-25%;bottom:-45%;width:100%;height:75%}
.scene .actor{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);font-size:clamp(80px,14vw,130px);line-height:1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}
.scene .sign{position:absolute;left:7%;bottom:12%;display:flex;flex-direction:column;align-items:center}
.scene .sign span{background:#FFF8E6;color:#4A3515;border:3px solid #8A6436;border-radius:8px;padding:4px 10px;font-family:var(--display);font-size:clamp(14px,2vw,18px);white-space:nowrap}
.scene .sign i{width:6px;height:34px;background:#8A6436}
.scene.rolling .actor{animation:none}
.scene .scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene.rolling .scene-img{display:none}
.lightbox{position:fixed;inset:0;z-index:45;background:rgba(10,18,14,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:88vh;border-radius:14px}
.lightbox span{color:#E3EFE6;font-size:14px}
.clue-img{cursor:zoom-in;width:100%;border-radius:12px;aspect-ratio:3/2;object-fit:cover;background:var(--paper-2)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}

.story{display:flex;flex-direction:column;gap:14px}
.story h2{font-size:clamp(26px,3.6vw,36px)}
.lines{display:flex;flex-direction:column;gap:10px;font-size:19px}
.lines p{padding-left:14px;border-left:4px solid var(--line)}
.lines p:last-child{border-left-color:var(--brick);color:var(--ink);background:var(--brick-soft);padding:8px 12px 8px 14px;border-radius:0 12px 12px 0}
.think{display:flex;gap:10px;align-items:flex-start;background:var(--sky-soft);border-radius:14px;padding:12px 14px}
.think svg{width:24px;height:24px;flex:none;color:var(--sky);margin-top:2px}

/* investigation */
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.wall{margin-top:18px}
@media (max-width:760px){.methods{grid-template-columns:1fr}}
.method{border:2px solid var(--line);border-radius:18px;background:var(--paper-2);display:flex;flex-direction:column;overflow:hidden}
.method > button{background:none;border:0;padding:16px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.method .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--sky-soft);color:var(--sky)}
.method .ic svg{width:26px;height:26px}
.method h3{font-size:20px}
.method small{display:block;color:var(--ink-2);font-size:14px;line-height:1.4}
.method .clues{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.method.open{border-color:var(--sky);background:var(--paper)}
.method .cta{font-family:var(--display);color:var(--sky);font-size:15px;margin-left:auto;white-space:nowrap}
.bubble{background:var(--sky-soft);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:16px}
.bubble b{display:block;font-family:var(--display);font-weight:400;color:var(--sky);font-size:14px}
.note{background:var(--sun-soft);border-radius:10px;padding:10px 12px;font-size:16px;position:relative}
.note::before{content:"단서";font-family:var(--display);font-size:12px;color:#8A6410;display:block}
:root[data-theme="dark"] .note::before{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .note::before{color:var(--sun)}}
.progress{display:flex;align-items:center;gap:10px;font-family:var(--display);color:var(--ink-2)}
.progress .bar{flex:1;height:10px;background:var(--paper-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress .bar i{display:block;height:100%;background:var(--sky);transition:width .3s}

/* hints */
.hints{display:flex;flex-direction:column;gap:10px}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);border-radius:14px;padding:12px 14px;animation:pop .35s ease}
.hint .k{font-family:var(--display);flex:none;background:var(--sun);color:#2A2004;border-radius:8px;padding:0 8px;font-size:14px;margin-top:3px}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}

/* canvas */
.board-draw{display:flex;flex-direction:column;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sz{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{border-color:var(--ink)}
.tool{height:36px;border-radius:10px;border:2px solid var(--line);background:var(--paper);padding:0 10px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2)}
.sep{width:1px;height:26px;background:var(--line)}
canvas#pad{width:100%;max-width:100%;aspect-ratio:900/560;background:#fff;border-radius:16px;border:2px solid var(--line);touch-action:none;cursor:crosshair;display:block;
  background-image:linear-gradient(#EEF3F8 1px,transparent 1px),linear-gradient(90deg,#EEF3F8 1px,transparent 1px);background-size:30px 30px}

/* present card */
.card{border:3px solid var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--paper)}
.card .ch{display:flex;gap:12px;align-items:center}
.card .em{font-size:46px;line-height:1}
.card .ch h3{font-size:24px}
.card .ch small{color:var(--ink-2);font-size:14px;display:block}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
.card dt{font-family:var(--display);color:var(--leaf);white-space:nowrap}
.card dd{margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.card img{border-radius:12px;border:2px solid var(--line);background:#fff}
.empty{color:var(--ink-2);font-style:italic}
@media (max-width:480px){.card dl{grid-template-columns:1fr}.card dt{margin-top:6px}}

.real{display:flex;gap:14px;background:var(--leaf-soft);border-radius:18px;padding:16px 18px;align-items:flex-start}
.real svg{width:30px;height:30px;color:var(--leaf);flex:none}
.real h3{font-size:20px;margin-bottom:4px}

.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* class board */
.wall{display:flex;flex-direction:column;gap:14px}
.wall-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.wall-head h2{font-size:26px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.post{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.post img{width:100%;aspect-ratio:900/560;object-fit:cover;background:#fff;border-bottom:1px solid var(--line)}
.post .noimg{aspect-ratio:900/560;display:grid;place-items:center;font-size:64px;background:var(--paper-2)}
.post .pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.post .team{font-family:var(--display);font-size:19px}
.post .pt{font-size:14px;color:var(--ink-2)}
.post .sol{font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.mini{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 10px;font-size:14px;display:inline-flex;align-items:center;gap:5px}
.mini.like{border-color:var(--sun);background:var(--sun-soft)}
.mini.warn{border-color:var(--brick);color:var(--brick)}
.wall .emptywall{background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-family:var(--display);z-index:50}

/* presentation overlay */
.show{position:fixed;inset:0;z-index:40;background:var(--ground);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.show .sbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.show .sbar .who{font-family:var(--display);font-size:20px}
.show .dots{display:flex;gap:6px}
.show .dots i{width:34px;height:8px;border-radius:9px;background:var(--line)}
.show .dots i.on{background:var(--sun)}
.slide{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;text-align:center;padding:16px 0}
.slide .tag{font-family:var(--display);background:var(--leaf);color:var(--on-leaf);border-radius:999px;padding:4px 18px;font-size:clamp(16px,2vw,22px)}
.slide h2{font-size:clamp(30px,5vw,56px);max-width:24ch}
.slide .big{font-size:clamp(20px,2.8vw,32px);max-width:36ch;white-space:pre-wrap;line-height:1.55}
.slide .em{font-size:clamp(80px,12vw,140px);line-height:1}
.slide img{max-height:46vh;width:auto;max-width:100%;border-radius:16px;border:3px solid var(--line);background:#fff}
.slide .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slide .pills span{background:var(--sun-soft);border-radius:999px;padding:4px 14px;font-size:clamp(16px,2vw,22px)}
.show .snav{display:flex;justify-content:space-between;gap:10px}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

function chip(group,label,on){return `<button type="button" class="chip" data-group="${group}" data-val="${esc(label)}" aria-pressed="${on}">${esc(label)}</button>`;}

/* ---------- 방안 결정 표 ---------- */
function decTable(){
  const rows=S.ideas.map((d,i)=>[d,i]).filter(([d])=>d.text.trim());
  const tots=rows.map(([d])=>MB.ideaTotal(d));const best=Math.max(...tots);
  const stars=(i,k,lab)=>{const n=((S.ideas[i].s||{})[k])||0;return `<span class="stars ${k==='con'?'neg':''}" role="group" aria-label="${lab} 별점"><b aria-hidden="true">${k==='con'?'−':'+'}</b>${[1,2,3,4,5].map(v=>`<button type="button" data-star="${i}|${k}|${v}" aria-label="${lab} 별 ${v}개" aria-pressed="${v<=n}">${v<=n?'★':'☆'}</button>`).join('')}</span>`;};
  return `<div class="cmp-wrap"><table class="cmp edit"><tr><th>해결 방안</th><th>장점</th><th>단점</th><th>적절한 시간과<br>비용이 필요한가요?</th><th>모두에게<br>도움이 되나요?</th><th>총 별점</th><th>결정</th></tr>${rows.map(([d,i],r)=>`<tr class="${S.chosen===i?'pick':''}">
    <th scope="row">${esc(d.text)}${d.name?`<small>${esc(d.name)}</small>`:''}</th>
    <td><textarea data-idea="${i}" data-f="pro" aria-label="장점" placeholder="좋은 점">${esc(d.pro||'')}</textarea>${stars(i,'pro','장점')}</td>
    <td><textarea data-idea="${i}" data-f="con" aria-label="단점" placeholder="아쉬운 점">${esc(d.con||'')}</textarea>${stars(i,'con','단점')}</td>
    <td>${stars(i,'cost','시간과 비용')}</td><td>${stars(i,'all','모두에게 도움')}</td>
    <td class="cmp-tot">별 ${tots[r]}개${rows.length>1&&tots[r]===best&&best>0?'<small>가장 많아요</small>':''}</td>
    <td><button type="button" class="pickbtn" data-choose="${i}" aria-pressed="${S.chosen===i}">${S.chosen===i?'결정!':'이걸로 결정'}</button></td></tr>`).join('')}</table></div>`;
}

/* ---------- summary / card ---------- */
function summary(){const s=sc();return {
  id:Date.now().toString(36),sid:s.id,emoji:s.emoji,title:s.title,place:s.place,team:S.team.trim(),
  who:[...S.who,...(S.whoEtc.trim()?[S.whoEtc.trim()]:[])],problem:S.sentence.trim()||s.story[s.story.length-1],
  ideas:S.ideas.filter(d=>d.text.trim()).map(d=>({name:d.name.trim(),text:d.text.trim(),pro:(d.pro||'').trim(),con:(d.con||'').trim(),s:Object.assign({pro:0,con:0,cost:0,all:0},d.s||{})})),
  chosen:S.chosen>=0?S.ideas.filter(d=>d.text.trim()).indexOf(S.ideas[S.chosen]):-1,
  tell:S.tell,causes:S.causes,causeText:S.causeText.trim(),types:S.types,solution:S.solution.trim(),helper:S.helper.trim(),
  drawing:S.drawing,action:S.action.trim(),effect:S.effect.trim(),likes:0};}
const val=(v,ph)=>v?esc(v):`<span class="empty">${ph}</span>`;
function cardHTML(m){return `<div class="card">
  <div class="ch"><span class="em" aria-hidden="true">${m.emoji}</span><div><small>${esc(m.place)} · ${m.team?esc(m.team):'모둠 이름을 써 주세요'}</small><h3>${esc(m.title)}</h3></div></div>
  <dl>
    <dt>문제</dt><dd>${val(m.problem,'2단계에서 문제를 정리해요')}</dd>
    <dt>원인</dt><dd>${val([...m.causes,m.causeText].filter(Boolean).join('\n'),'3단계에서 원인을 찾아요')}</dd>
    <dt>비교한 방안</dt><dd>${val((m.ideas||[]).map((d,i)=>`${i===m.chosen?'✔ ':'· '}${d.text} (별 ${MB.ideaTotal(d)}개)`).join('\n'),'4·5단계에서 의견을 내고 비교해요')}</dd>
    <dt>결정한 방안</dt><dd>${val(m.solution,'5단계에서 결정해요')}</dd>
    <dt>도움 요청</dt><dd>${val(m.helper,'누구의 도움이 필요할까요?')}</dd>
    <dt>먼저 할 일</dt><dd>${val(m.action,'가장 먼저 할 일을 써요')}</dd>
    <dt>기대 효과</dt><dd>${val(m.effect,'마을이 어떻게 달라질까요?')}</dd>
  </dl>
  ${m.drawing?`<img src="${m.drawing}" alt="해결 설계도">`:`<p class="empty">5단계에서 그린 설계도가 여기에 나타나요.</p>`}
</div>`;}

/* ---------- render ---------- */
function render(){
  $('#path').innerHTML=STEPS.map((t,i)=>`<button type="button" class="stone ${i===S.step?'on':i<S.step?'done':''}" data-step="${i}" ${i===S.step?'aria-current="step"':''}><span class="dot">${i+1}</span><span class="lab">${t}</span></button>`).join('');
  $('#main').innerHTML=views[S.step]();
  const prev=S.step>0?`<button class="btn ghost" type="button" id="prev">← ${STEPS[S.step-1]}</button>`:'<span></span>';
  const next=S.step<5?`<button class="btn primary" type="button" id="next">${STEPS[S.step+1]} →</button>`:`<button class="btn sun" type="button" id="again">다른 문제 해결하러 가기</button>`;
  $('#nav').innerHTML=prev+next;
  $('#pick').value=S.sid;
  if(S.step===4&&$('#pad')) setupPad();
  if(S.step===5) $('#preview').innerHTML=cardHTML(summary());
}
function go(i){S.step=Math.max(0,Math.min(5,i));render();window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const ci=e.target.closest('.clue-img');
  if(ci){const lb=$('#lightbox');lb.querySelector('img').src=ci.src;lb.hidden=false;return;}
  if(e.target.closest('#lightbox')){$('#lightbox').hidden=true;return;}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.step){go(+t.dataset.step);return;}
  if(t.dataset.group){const g=t.dataset.group,v=t.dataset.val,arr=S[g];const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);t.setAttribute('aria-pressed',i<0);S.touched=true;return;}
  if(t.dataset.open){S.opened[t.dataset.open]=true;S.touched=true;render();return;}
  if(t.dataset.star){const [i,k,v]=t.dataset.star.split('|');const d=S.ideas[+i];d.s=Object.assign({pro:0,con:0,cost:0,all:0},d.s);d.s[k]=d.s[k]===+v?+v-1:+v;S.touched=true;$('#decTable').innerHTML=decTable();const nb=$(`[data-star="${i}|${k}|${v}"]`);if(nb)nb.focus();return;}
  if(t.dataset.choose){const i=+t.dataset.choose,d=S.ideas[i];S.chosen=i;S.touched=true;
    if(!S.solution.trim()||S.solution===S.autoSol){S.solution=d.text.trim();S.autoSol=S.solution;const ta=$('#solution');if(ta)ta.value=S.solution;}
    $('#decTable').innerHTML=decTable();toast('결정했어요. 아래에 결정한 방안을 다듬고 설계도를 그려요');return;}
  if(t.dataset.delidea){const i=+t.dataset.delidea;S.ideas.splice(i,1);if(S.chosen===i)S.chosen=-1;else if(S.chosen>i)S.chosen--;render();return;}
  if(t.id==='addIdea'){S.ideas.push({name:'',text:''});render();const ins=document.querySelectorAll('[data-f="name"]');if(ins.length)ins[ins.length-1].focus();return;}
  switch(t.id){
    case 'next':go(S.step+1);break;
    case 'prev':go(S.step-1);break;
    case 'moreHint':S.hints++;render();break;
    case 'present':openShow(summary());break;
    case 'post':postIt();break;
    case 'again':askSwitch(randomId(S.sid),true);break;
    case 'roll':askSwitch(randomId(S.sid),true);break;
    case 'cYes':doSwitch();break;
    case 'cNo':$('#confirm').hidden=true;pending=null;$('#pick').value=S.sid;break;
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(e.target.dataset.idea){const d=S.ideas[+e.target.dataset.idea];if(d){d[e.target.dataset.f]=e.target.value;S.touched=true;}return;}
  if(['whoEtc','sentence','causeText','solution','helper','team','action','effect'].includes(id)){S[id]=e.target.value;S.touched=true;if(S.step===5)$('#preview').innerHTML=cardHTML(summary());}
});
$('#pick').addEventListener('change',e=>{if(e.target.value)askSwitch(e.target.value,false);});

let pending=null;
function askSwitch(id,animate){pending={id,animate};if(S.touched){$('#confirm').hidden=false;$('#cYes').focus();}else doSwitch();}
function doSwitch(){
  if(!pending)return;const {id,animate}=pending;pending=null;$('#confirm').hidden=true;
  S=fresh(id);render();
  if(animate&&!reduce){
    const scene=$('#scene'),actor=$('#actor');if(!scene)return;scene.classList.add('rolling');
    let k=0;const target=sc();const timer=setInterval(()=>{
      const r=SCEN[k++%SCEN.length];actor.textContent=r.emoji;scene.style.setProperty('--scene-sky',r.sky);scene.style.setProperty('--scene-hill',r.hill);
      if(k>14){clearInterval(timer);actor.textContent=target.emoji;scene.style.setProperty('--scene-sky',target.sky);scene.style.setProperty('--scene-hill',target.hill);scene.classList.remove('rolling');}
    },70);
  }
}

/* ---------- drawing pad ---------- */
const COLORS=['#1F2A24','#D2553A','#E9A817','#2E8553','#2F7DBA','#8A55D6','#8A5A3C'];
const SIZES=[4,10,22];
let pen={c:COLORS[0],w:10,erase:false},undo=[];
function setupPad(){
  const tb=$('#tb');
  const draw=()=>{tb.innerHTML=COLORS.map(c=>`<button type="button" class="sw" data-c="${c}" style="background:${c}" aria-label="색 ${c}" aria-pressed="${!pen.erase&&pen.c===c}"></button>`).join('')+
    '<span class="sep"></span>'+SIZES.map(w=>`<button type="button" class="sz" data-w="${w}" aria-label="굵기 ${w}" aria-pressed="${pen.w===w}"><i style="width:${Math.max(4,w/1.4)}px;height:${Math.max(4,w/1.4)}px"></i></button>`).join('')+
    `<span class="sep"></span><button type="button" class="tool" data-t="erase" aria-pressed="${pen.erase}">지우개</button><button type="button" class="tool" data-t="undo">되돌리기</button><button type="button" class="tool" data-t="clear">모두 지우기</button>`;};
  draw();
  tb.onclick=e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();
    if(b.dataset.c){pen.c=b.dataset.c;pen.erase=false;}
    else if(b.dataset.w){pen.w=+b.dataset.w;}
    else if(b.dataset.t==='erase'){pen.erase=!pen.erase;}
    else if(b.dataset.t==='undo'){undo.pop();S.drawing=undo[undo.length-1]||null;paint();}
    else if(b.dataset.t==='clear'){if(S.drawing){undo.push(null);}S.drawing=null;paint();}
    draw();};
  const cv=$('#pad'),ctx=cv.getContext('2d');
  function paint(){ctx.clearRect(0,0,cv.width,cv.height);if(S.drawing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=S.drawing;}}
  paint();
  let down=false,last=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);last=pt(e);stroke(last,last);};
  cv.onpointermove=e=>{if(!down)return;const p=pt(e);stroke(last,p);last=p;};
  cv.onpointerup=cv.onpointercancel=()=>{if(!down)return;down=false;S.drawing=cv.toDataURL('image/png');undo.push(S.drawing);if(undo.length>25)undo.shift();S.touched=true;};
  function stroke(a,b){ctx.globalCompositeOperation=pen.erase?'destination-out':'source-over';ctx.strokeStyle=pen.c;ctx.lineWidth=pen.erase?pen.w*2.2:pen.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0]+.01,b[1]);ctx.stroke();}
}

/* ---------- presentation ---------- */
let slides=[],si=0;
function openShow(m){
  m=Object.assign({ideas:[],chosen:-1,who:[],causes:[],types:[],tell:[],problem:"",solution:"",causeText:"",helper:"",action:"",effect:""},m);
  slides=[
    `<span class="tag">우리가 찾은 문제</span>${img(m.sid,'scene')?`<img src="${img(m.sid,'scene')}" alt="">`:`<div class="em" aria-hidden="true">${m.emoji}</div>`}<h2>${esc(m.title)}</h2><p class="big">${esc(m.problem)}</p>${m.who.length?`<div class="pills">${m.who.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`:''}`,
    `<span class="tag">원인은 이것이에요</span>${m.causes.length?`<div class="pills">${m.causes.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:''}<p class="big">${m.causeText?esc(m.causeText):(m.causes.length?'':'원인을 아직 정리하지 않았어요.')}</p>`,
    ...(m.ideas.length?[`<span class="tag">여러 해결 방안을 비교했어요</span>${MB.compareHTML(m.ideas,m.chosen)}`]:[]),
    `<span class="tag">우리가 결정한 해결 방안</span>${m.drawing?`<img src="${m.drawing}" alt="해결 설계도">`:''}<p class="big">${m.solution?esc(m.solution):'해결 방법을 아직 쓰지 않았어요.'}</p>${m.types.length?`<div class="pills">${m.types.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:''}`,
    `<span class="tag">이렇게 실천할게요</span>${m.helper?`<p class="big"><b>도움 요청</b> · ${esc(m.helper)}</p>`:''}${m.action?`<p class="big"><b>먼저 할 일</b> · ${esc(m.action)}</p>`:''}<h2>${m.effect?esc(m.effect):'모두가 함께 행복한 마을!'}</h2>`
  ];
  si=0;const el=$('#show');el.hidden=false;drawShow(m);
  try{document.documentElement.requestFullscreen?.().catch(()=>{});}catch(_){}
}
function drawShow(m){
  const el=$('#show');m=m||el._m;el._m=m;
  el.innerHTML=`<div class="sbar"><span class="who">${[MB.clsLabel(m.cls||CLS),m.team||m.place].filter(Boolean).map(esc).join(' · ')}</span><div class="dots">${slides.map((_,i)=>`<i class="${i===si?'on':''}"></i>`).join('')}</div><button class="btn ghost" type="button" id="sx">닫기</button></div>
  <div class="slide">${slides[si]}</div>
  <div class="snav"><button class="btn ghost" type="button" id="sp" ${si===0?'disabled':''}>← 이전</button><button class="btn primary" type="button" id="sn">${si===slides.length-1?'발표 끝!':'다음 →'}</button></div>`;
  $('#sx').onclick=closeShow;$('#sp').onclick=()=>{if(si>0){si--;drawShow();}};
  $('#sn').onclick=()=>{if(si<slides.length-1){si++;drawShow();}else closeShow();};
  $('#sn').focus();
}
function closeShow(){$('#show').hidden=true;try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(_){}}
document.addEventListener('keydown',e=>{if($('#show').hidden)return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(si<slides.length-1){si++;drawShow();}}
  else if(e.key==='ArrowLeft'){if(si>0){si--;drawShow();}}
  else if(e.key==='Escape')closeShow();});

/* ---------- 반별 게시판 (Firebase: maeul/posts/{반}/{글}) ---------- */
let posts={}, likes={}, armed=null, ready=false, unsub=[];
function shrink(src){return new Promise(res=>{if(!src)return res(null);const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=600;c.height=373;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,600,373);x.drawImage(im,0,0,600,373);res(c.toDataURL('image/jpeg',.72));};im.onerror=()=>res(null);im.src=src;});}
const label=k=>MB.clsLabel(k);
let posting=false;
async function postIt(){
  if(posting)return;
  const m=summary();
  if(!CLS){toast('먼저 반을 골라 주세요');showPicker();return;}
  if(!m.team){toast('모둠 이름을 먼저 써 주세요');$('#team').focus();return;}
  if(!m.solution){toast('5단계에서 결정한 해결 방안을 써 주세요');return;}
  if(!ready){toast('아직 저장소에 연결되지 않았어요. 인터넷을 확인해 주세요');return;}
  posting=true;const btn=$('#post');if(btn){btn.disabled=true;btn.textContent='올리는 중…';}
  try{
    const drawing=await shrink(m.drawing);
    const row={uid:MB.uid(),at:MB.now(),sid:m.sid,emoji:m.emoji,title:m.title,place:m.place,team:m.team.slice(0,40),
      who:m.who,problem:m.problem,tell:m.tell,causes:m.causes,causeText:m.causeText,types:m.types,
      solution:m.solution.slice(0,2000),ideas:m.ideas,chosen:m.chosen,helper:m.helper,action:m.action,effect:m.effect};
    if(drawing)row.drawing=drawing;
    Object.keys(row).forEach(k=>{if(row[k]===''||(Array.isArray(row[k])&&!row[k].length))delete row[k];});
    row.team=m.team.slice(0,40);row.solution=m.solution.slice(0,2000);
    await MB.push('maeul/posts/'+CLS,row);
    toast(`${label(CLS)} 게시판에 올렸어요`);
    $('#wall').scrollIntoView({behavior:reduce?'auto':'smooth'});
  }catch(e){console.error(e);toast('올리지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요');}
  finally{posting=false;const b=$('#post');if(b){b.disabled=false;b.textContent='게시판에 올리기';}}
}
const likeCount=id=>Object.keys((likes||{})[id]||{}).length;
const iLiked=id=>!!((likes||{})[id]||{})[MB.uid()];
function renderBoard(){
  const box=$('#posts');
  $('#wallTitle').textContent=CLS?`${label(CLS)} 해결 게시판`:'해결 게시판';
  if(!CLS){box.innerHTML=`<div class="emptywall">반을 고르면 우리 반 게시판이 보여요.</div>`;return;}
  if(!ready){box.innerHTML=`<div class="emptywall">게시판을 불러오는 중이에요…</div>`;return;}
  const list=Object.entries(posts||{}).map(([id,p])=>Object.assign({id},p)).sort((a,b)=>(b.at||0)-(a.at||0));
  if(!list.length){box.innerHTML=`<div class="emptywall">${esc(label(CLS))}에는 아직 올라온 해결 방법이 없어요. 첫 번째 모둠이 되어 보세요!</div>`;return;}
  const me=MB.uid();
  box.innerHTML=`<div class="posts">${list.map(p=>`<article class="post">
    ${p.drawing?`<img src="${p.drawing}" alt="${esc(p.team)} 설계도">`:img(p.sid,'scene')?`<img src="${img(p.sid,'scene')}" alt="">`:`<div class="noimg" aria-hidden="true">${esc(p.emoji||'')}</div>`}
    <div class="pb"><span class="team">${esc(p.team)}</span><span class="pt">${esc(p.emoji||'')} ${esc(p.title||'')}</span><p class="sol">${esc(p.solution)}</p>
    <div class="acts"><button type="button" class="mini like" data-like="${p.id}" aria-pressed="${iLiked(p.id)}">${iLiked(p.id)?'★':'☆'} 칭찬 ${likeCount(p.id)}</button><button type="button" class="mini" data-show="${p.id}">발표 보기</button>${p.uid===me?`<button type="button" class="mini ${armed===p.id?'warn':''}" data-del="${p.id}">${armed===p.id?'정말 지울까요?':'지우기'}</button>`:''}</div></div>
  </article>`).join('')}</div>`;
}
$('#posts').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();
  const id=b.dataset.like||b.dataset.show||b.dataset.del;const p=posts&&posts[id];if(!p)return;
  try{
    if(b.dataset.like){const path=`maeul/likes/${CLS}/${id}/${MB.uid()}`;iLiked(id)?await MB.remove(path):await MB.set(path,true);}
    else if(b.dataset.show){openShow(Object.assign({cls:CLS},p));}
    else if(b.dataset.del){if(armed===id){armed=null;await MB.remove(`maeul/posts/${CLS}/${id}`);toast('지웠어요');}else{armed=id;renderBoard();}}
  }catch(err){console.error(err);toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요');}
});
let tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400);}

/* ---------- 반 고르기 ---------- */
let classes=[],CLS=null,picking=false;
try{CLS=localStorage.getItem('maeul-cls')||null;}catch(_){}
if(CLS&&!MB.validCls(CLS))CLS=null;
function watchClass(){
  unsub.forEach(f=>f());unsub=[];posts={};likes={};armed=null;renderBoard();
  if(!CLS||!ready)return;
  unsub.push(MB.on('maeul/posts/'+CLS,v=>{posts=v||{};renderBoard();},err=>{console.error(err);$('#posts').innerHTML=`<div class="emptywall">게시판을 불러오지 못했어요. 선생님께 알려 주세요.</div>`;}));
  unsub.push(MB.on('maeul/likes/'+CLS,v=>{likes=v||{};renderBoard();},()=>{}));
}
function setClass(k){
  CLS=k;try{localStorage.setItem('maeul-cls',k);}catch(_){}
  if(!classes.includes(k)){classes.push(k);MB.sortCls(classes);if(ready)MB.set('maeul/classes/'+k,true).catch(()=>{});}
  picking=false;renderClassbar();watchClass();
}
function showPicker(){picking=true;renderClassbar();window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});}
function renderClassbar(){
  const bar=$('#classbar');const gate=picking||!CLS;
  ['#path','#main','#nav','.tools'].forEach(s=>$(s).hidden=gate);
  if(gate)$('#confirm').hidden=true;
  if(!gate){bar.className='classbar';bar.innerHTML=`<span class="lbl">지금 활동하는 반</span><span class="now"><i>${esc(label(CLS))}</i></span><button type="button" class="btn ghost" id="chgCls" style="margin-left:auto">반 바꾸기</button>`;return;}
  const g=(CLS||'4-').split('-')[0];
  bar.className='classbar picker';
  bar.innerHTML=`<div><span class="eyebrow">시작하기</span><h2>어느 반이 활동하나요?</h2><p class="guide">올린 결과는 고른 반의 게시판에 모이고, 선생님 화면에서 반별로 볼 수 있어요. 반을 바꿔도 지금 쓰던 내용은 그대로 남아요.</p></div>
   ${classes.length?`<div class="cls-grid">${classes.map(k=>`<button type="button" class="cls-btn ${k===CLS?'cur':''}" data-cls="${esc(k)}">${esc(label(k))}</button>`).join('')}</div>`:''}
   <div class="addrow"><span>${classes.length?'목록에 없는 반:':'우리 반:'}</span>
     <select id="gNew" aria-label="학년">${[3,4,5,6].map(x=>`<option ${String(x)===g?'selected':''}>${x}</option>`).join('')}</select><span>학년</span>
     <input type="text" id="cNew" inputmode="numeric" maxlength="2" placeholder="1" aria-label="반"><span>반</span>
     <button type="button" class="btn primary" id="addCls">이 반으로 시작</button>
     ${CLS?`<button type="button" class="btn ghost" id="cancelCls">취소</button>`:''}</div>`;
}
$('#classbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();
  if(b.id==='chgCls')showPicker();
  else if(b.id==='cancelCls'){picking=false;renderClassbar();}
  else if(b.dataset.cls)setClass(b.dataset.cls);
  else if(b.id==='addCls'){const n=$('#cNew').value.trim().replace(/반$/,'').replace(/^0+/,'');const k=MB.clsKey($('#gNew').value,n);
    if(!MB.validCls(k)){toast('반 번호를 1~20 사이 숫자로 써 주세요');$('#cNew').focus();return;}setClass(k);}
});
$('#classbar').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cNew')$('#addCls').click();});

/* ---------- init ---------- */
$('#pick').innerHTML=`<option value="">문제 목록에서 고르기</option>`+SCEN.map(s=>`<option value="${s.id}">${s.emoji} ${esc(s.title)}</option>`).join('');
S=fresh(randomId(null));
render();renderClassbar();renderBoard();
(async()=>{
  try{
    await MB.init();await MB.signInAnon();ready=true;
    MB.onConnection(on=>{$('#offline').hidden=on;});
    MB.on('maeul/classes',v=>{const ks=Object.keys(v||{}).filter(MB.validCls);
      if(CLS&&!ks.includes(CLS))ks.push(CLS);classes=MB.sortCls(ks);if(picking||!CLS)renderClassbar();},()=>{});
    if(CLS)MB.set('maeul/classes/'+CLS,true).catch(()=>{});
    watchClass();
  }catch(e){console.error(e);$('#offline').hidden=false;$('#offline').textContent='저장소에 연결하지 못했어요. 활동은 할 수 있지만 게시판에 올리려면 인터넷 연결이 필요해요.';renderBoard();}
})();
</script>
